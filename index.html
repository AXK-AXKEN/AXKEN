<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 50% 0%, rgba(239,68,68,.16), transparent 35%),
        linear-gradient(145deg, #050505 0%, #09090b 55%, #120607 100%);
    display: flex;
    justify-content: center;
    padding: 25px 15px 45px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 35px 35px;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
}

.container {
    width: min(100%, 500px);
    padding: 38px 28px 30px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 30px;
    background: rgba(10,10,13,.88);
    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 45px rgba(239,68,68,.06);
    backdrop-filter: blur(14px);
    position: relative;
    z-index: 1;
}

.profile-img-container {
    width: 145px;
    height: 145px;
    margin: 0 auto 24px;
    position: relative;
}

.profile-img-container::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    background: conic-gradient(
        #ff3030,
        #ff6b6b,
        #7f1d1d,
        #ff3030
    );
    animation: spin 5s linear infinite;
    z-index: -1;
}

.profile-img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    border: 4px solid #09090b;
    background: #111;
    box-shadow:
        0 0 25px rgba(239,68,68,.45),
        0 0 60px rgba(239,68,68,.12);
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.profile-img-container::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    right: 4px;
    bottom: 10px;
    border-radius: 50%;
    background: #22c55e;
    border: 4px solid #09090b;
    box-shadow: 0 0 12px rgba(34,197,94,.8);
}

h2 {
    text-align: center;
    margin-top: 4px;
    font-size: clamp(30px, 8vw, 38px);
    font-weight: 950;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 22px rgba(239,68,68,.28);
}

.username {
    text-align: center;
    margin-top: 5px;
    margin-bottom: 12px;
    color: #ff4b4b;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
}

.bio {
    text-align: center;
    color: #a1a1aa;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 22px;
}

.divider {
    width: 70px;
    height: 4px;
    margin: 0 auto 28px;
    border-radius: 99px;
    background: linear-gradient(90deg, #ff3030, #ff7777);
    box-shadow: 0 0 18px rgba(239,68,68,.55);
}

.social-link {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 76px;
    gap: 14px;
    padding: 12px 18px;
    margin: 14px 0;
    border-radius: 17px;
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    transition: transform .25s ease, filter .25s ease, box-shadow .25s ease;
}

.social-link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.16), transparent 75%);
    transform: translateX(-120%);
    transition: transform .55s ease;
}

.social-link:hover {
    transform: translateY(-4px) scale(1.015);
    filter: brightness(1.08);
}

.social-link:hover::before {
    transform: translateX(120%);
}

.icon {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: rgba(255,255,255,.14);
    font-size: 23px;
}

.link-text {
    flex: 1;
}

.arrow {
    font-size: 25px;
    opacity: .75;
}

.discord {
    background: linear-gradient(135deg, #5865f2, #4652c9);
    box-shadow: 0 10px 28px rgba(88,101,242,.28);
}

.whatsapp {
    background: linear-gradient(135deg, #25d366, #119b4a);
    box-shadow: 0 10px 28px rgba(37,211,102,.22);
}

.youtube {
    background: linear-gradient(135deg, #ff1515, #c90000);
    box-shadow: 0 10px 28px rgba(255,0,0,.24);
}

.email {
    background: linear-gradient(135deg, #f97316, #c2410c);
    box-shadow: 0 10px 28px rgba(249,115,22,.22);
}

.ad-container {
    margin-top: 30px;
    padding: 16px 10px;
    min-height: 100px;
    background: rgba(3,7,18,.72);
    border: 1px solid #27272a;
    border-radius: 18px;
    text-align: center;
}

.ad-title {
    color: #52525b;
    font-size: 9px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.footer {
    margin-top: 22px;
    text-align: center;
    color: #52525b;
    font-size: 11px;
}

@media (max-width: 480px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 30px 18px 24px;
        border-radius: 24px;
    }

    .profile-img-container {
        width: 125px;
        height: 125px;
    }

    .social-link {
        min-height: 70px;
        font-size: 15px;
    }
}
</style>
