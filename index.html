        body {

            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #111827;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #1f2937;
        }

        /* Foto de perfil */
        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            position: relative;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            object-fit: cover;
            display: block;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 30px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 900;
            margin-top: 0;
        }
        p {
            color: #94a3b8;
            font-size: 17px;
            margin-bottom: 35px;
            margin-top: 5px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #ffffff;
            text-decoration: none;
            padding: 18px 24px;
            margin: 16px 0;
            border-radius: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 18px;
        }
        .social-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        /* Colores de botones */
        .discord { background-color: #5865F2; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); }
        .whatsapp { background-color: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .youtube { background-color: #FF0000; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4); }
        .email { background-color: #ea580c; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4); }
        
        .icon { font-size: 1.5em; }

        /* Contenedor del Native Banner */

            margin-top: 45px;
            padding: 15px;
            background-color: #030712;
            border: 1px solid #1f2937;
            border-radius: 12px;
            text-align: center;
