<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad y Contenido</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h2 {
            margin-bottom: 8px;
            font-size: 24px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .social-link:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .discord { background-color: #5865F2; }
        .whatsapp { background-color: #25D366; }
        .youtube { background-color: #FF0000; }
        .email { background-color: #ea580c; }

        /* Estilo para el espacio de Monetización / Anuncios */
        .ad-container {
            margin-top: 25px;
            padding: 15px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 10px;
            text-align: center;
        }
        .ad-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mi Comunidad</h2>
        <p>Conéctate conmigo, mira mi contenido y colabora</p>

        <!-- Enlace de Discord -->
        <a href="TU_ENLACE_DE_DISCORD" target="_blank" class="social-link discord">
            Comunidad de Discord
        </a>

        <!-- Enlace de WhatsApp -->
        <a href="TU_ENLACE_DE_WHATSAPP" target="_blank" class="social-link whatsapp">
            Comunidad de WhatsApp
        </a>

        <!-- Enlace de YouTube -->
        <a href="TU_ENLACE_DE_YOUTUBE" target="_blank" class="social-link youtube">
            Canal de YouTube
        </a>

        <!-- Correo para Colaboraciones -->
        <a href="mailto:tu-correo@example.com" class="social-link email">
            Contacto / Colaboraciones
        </a>

        <!-- BLOQUE DE MONETIZACIÓN (Espacio para anuncios) -->
        <div class="ad-container">
            <div class="ad-title">Publicidad / Patrocinador</div>
            <!-- Aquí reemplazas este comentario o bloque con tu código de Google AdSense, 
                 banners de afiliados o script de monetización web -->
            <p style="color: #64748b; font-size: 13px; margin: 0;">
                [Espacio publicitario disponible para anuncios o monetización]
            </p>
        </div>

    </div>

</body>
</html>
