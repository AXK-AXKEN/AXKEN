<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mundo - Comunidad y Contenido</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #111827;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #1f2937;
        }

        /* Estilo de la foto de perfil */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 28px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 24px;
            margin: 15px 0;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 17px;
        }
        .social-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .discord { background-color: #5865F2; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3); }
        .whatsapp { background-color: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .youtube { background-color: #FF0000; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3); }
        .email { background-color: #ea580c; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.3); }
        
        .icon { font-size: 1.4em; }

        .ad-container {
            margin-top: 40px;
            padding: 20px;
            background: #030712;
            border: 2px dashed #1f2937;
            border-radius: 12px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ad-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4b5563;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- FOTO DE PERFIL INTEGRADA DIRECTAMENTE -->
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=" alt="Foto de Perfil" class="profile-img">

        <h2>Mi Mundo</h2>
        <p>Únete a la comunidad y sígueme en mis redes</p>

        <!-- Discord -->
        <a href="https://discord.gg/dwRXGFBTjB" target="_blank" class="social-link discord">
            <span class="icon">🎮</span> Comunidad de Discord
        </a>

        <!-- WhatsApp -->
        <a href="TU_ENLACE_DE_WHATSAPP" target="_blank" class="social-link whatsapp">
            <span class="icon">📱</span> Comunidad de WhatsApp
        </a>

        <!-- YouTube -->
        <a href="TU_ENLACE_DE_YOUTUBE" target="_blank" class="social-link youtube">
            <span class="icon">▶️</span> Canal de YouTube
        </a>

        <!-- Correo -->
        <a href="mailto:TU_CORREO@CORREO.COM" class="social-link email">
            <span class="icon">📧</span> Contacto / Colaboraciones
        </a>

        <!-- Anuncios -->
        <div class="ad-container">
            <div class="ad-title">Espacio Publicitario</div>
            <p style="color: #4b5563; font-size: 13px; margin: 0; font-style: italic;">
                (Aquí aparecerán tus anuncios cuando Google AdSense apruebe tu sitio)
            </p>
        </div>

    </div>

</body>
</html>
