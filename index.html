<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AXKEN | Mis Redes</title>

    <meta name="description" content="Únete a la comunidad de AXKEN y sígueme en mis redes sociales.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.16), transparent 35%),
                radial-gradient(circle at 0% 100%, rgba(127, 29, 29, 0.12), transparent 35%),
                #020204;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 15px;

            overflow-x: hidden;
        }


        /* =====================================
           FONDO DECORATIVO
        ===================================== */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;

            background: rgba(239, 68, 68, 0.08);
            filter: blur(120px);

            border-radius: 50%;

            top: -250px;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;
        }


        /* =====================================
           CONTENEDOR PRINCIPAL
        ===================================== */

        .container {

            width: 100%;
            max-width: 500px;

            position: relative;

            padding: 35px 28px 28px;

            background: rgba(10, 10, 14, 0.82);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 28px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.65),
                0 0 50px rgba(239,68,68,0.05);

            animation: aparecer 0.7s ease;
        }


        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =====================================
           FOTO DE PERFIL
        ===================================== */

        .profile-img-container {

            width: 135px;
            height: 135px;

            margin: 0 auto 22px;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Aura */

        .profile-img-container::before {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background: rgba(239,68,68,0.18);

            filter: blur(22px);

            animation: aura 2.5s infinite alternate ease-in-out;
        }


        @keyframes aura {

            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.08);
                opacity: 1;
            }

        }


        .profile-img {

            width: 135px;
            height: 135px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #ef4444;

            position: relative;
            z-index: 2;

            box-shadow:
                0 0 20px rgba(239,68,68,0.65),
                0 0 50px rgba(239,68,68,0.25);

            transition: 0.4s ease;
        }


        .profile-img:hover {

            transform: scale(1.05);

            box-shadow:
                0 0 25px rgba(239,68,68,0.8),
                0 0 70px rgba(239,68,68,0.35);
        }


        /* =====================================
           TITULO
        ===================================== */

        h1 {

            text-align: center;

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 2px;

            margin-bottom: 8px;

            text-transform: uppercase;

            background: linear-gradient(
                90deg,
                #ffffff,
                #ef4444,
                #ffffff
            );

            background-size: 200% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: brilloTexto 4s linear infinite;
        }


        @keyframes brilloTexto {

            to {
                background-position: 200% center;
            }

        }


        .username {

            text-align: center;

            color: #ef4444;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }


        .description {

            text-align: center;

            color: #94a3b8;

            font-size: 15px;

            line-height: 1.5;

            margin-bottom: 28px;
        }


        /* =====================================
           LINEA DECORATIVA
        ===================================== */

        .separator {

            width: 70px;
            height: 3px;

            margin: 0 auto 25px;

            border-radius: 10px;

            background: #ef4444;

            box-shadow: 0 0 15px rgba(239,68,68,0.7);
        }


        /* =====================================
           BOTONES
        ===================================== */

        .social-link {

            position: relative;

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 62px;

            padding: 16px 20px;

            margin: 13px 0;

            border-radius: 16px;

            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: 800;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }


        /* brillo que atraviesa el botón */

        .social-link::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.15),
                transparent
            );

            transform: skewX(-20deg);

            transition: 0.6s;
        }


        .social-link:hover::before {

            left: 140%;
        }


        .social-link:hover {

            transform: translateY(-4px) scale(1.015);

            filter: brightness(1.08);
        }


        .social-link:active {

            transform: scale(0.98);
        }


        /* Icono */

        .icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(255,255,255,0.14);

            font-size: 20px;

            margin-right: 14px;

            flex-shrink: 0;
        }


        .button-text {

            flex: 1;
        }


        .arrow {

            font-size: 20px;

            opacity: 0.6;

            transition: 0.25s;
        }


        .social-link:hover .arrow {

            opacity: 1;

            transform: translateX(4px);
        }


        /* =====================================
           COLORES
        ===================================== */

        .discord {

            background: linear-gradient(
                135deg,
                #5865F2,
                #404EBA
            );

            box-shadow:
                0 8px 25px rgba(88,101,242,0.25);
        }


        .whatsapp {

            background: linear-gradient(
                135deg,
                #25D366,
                #128C4A
            );

            box-shadow:
                0 8px 25px rgba(37,211,102,0.2);
        }


        .youtube {

            background: linear-gradient(
                135deg,
                #ff0000,
                #b40000
            );

            box-shadow:
                0 8px 25px rgba(255,0,0,0.22);
        }


        .email {

            background: linear-gradient(
                135deg,
                #f97316,
                #c2410c
            );

            box-shadow:
                0 8px 25px rgba(249,115,22,0.2);
        }


        /* =====================================
           ANUNCIO
        ===================================== */

        .ad-title {

            text-align: center;

            font-size: 10px;

            color: #475569;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 10px;
        }


        .ad-container {

            margin-top: 30px;

            padding: 15px;

            min-height: 100px;

            background: rgba(3,7,18,0.65);

            border: 1px solid #1f2937;

            border-radius: 16px;

            text-align: center;

            overflow: hidden;
        }


        /* =====================================
           FOOTER
        ===================================== */

        .footer {

            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid rgba(255,255,255,0.06);

            color: #475569;

            font-size: 12px;
        }


        .footer strong {

            color: #ef4444;
        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 480px) {

            body {
                padding: 15px 10px;
            }

            .container {
                padding: 30px 18px 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 29px;
            }

            .profile-img,
            .profile-img-container {
                width: 120px;
                height: 120px;
            }

            .profile-img-container::before {
                width: 140px;
                height: 140px;
            }

            .social-link {
                min-height: 60px;
                font-size: 15px;
            }

        }

    </style>
</head>
